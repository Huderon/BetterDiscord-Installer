# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
# GoReleaser v2 configuration for BetterDiscord Installer (Wails)
version: 2

project_name: BetterDiscord-Installer

# Wails relies on CGO and native toolchains, so releases should run on native OS runners.
# This config intentionally keeps packaging simple and stable-channel focused.
before:
  hooks:
    - go mod download
    - cd frontend && bun install --frozen-lockfile
    - cd frontend && bun run build

builds:
  - id: installer-linux
    skip: "{{ ne .Env.RELEASE_OS \"linux\" }}"
    main: .
    binary: BetterDiscord-Installer
    env:
      - CGO_ENABLED=1
    goos:
      - linux
    goarch:
      - amd64
    tags:
      - webkit2_41
    ldflags:
      - -s -w
      - -X main.version={{ .Tag }}

  - id: installer-windows
    skip: "{{ ne .Env.RELEASE_OS \"windows\" }}"
    main: .
    binary: BetterDiscord-Installer
    env:
      - CGO_ENABLED=1
    goos:
      - windows
    goarch:
      - amd64
    ldflags:
      - -s -w
      - -H=windowsgui
      - -X main.version={{ .Tag }}

  - id: installer-darwin
    skip: "{{ ne .Env.RELEASE_OS \"darwin\" }}"
    main: .
    binary: BetterDiscord-Installer
    env:
      - CGO_ENABLED=1
    goos:
      - darwin
    goarch:
      - amd64
    ldflags:
      - -s -w
      - -X main.version={{ .Tag }}

archives:
  # Keep Linux/macOS in zip archives to preserve executable metadata and provide a clean download.
  - id: portable-archives
    ids:
      - installer-linux
      - installer-darwin
    formats:
      - zip
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    files:
      - src: README.md
      - src: LICENSE

  # Keep Windows as a raw .exe as requested.
  - id: windows-raw
    ids:
      - installer-windows
    formats:
      - binary
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}

checksum:
  name_template: checksums_{{ .Env.RELEASE_OS }}.txt

release:
  draft: true
  prerelease: auto
  mode: keep-existing
  header: |
    ## BetterDiscord Installer {{ .Tag }}
  footer: |
    **Full Changelog**: https://github.com/BetterDiscord/Installer/compare/{{ .PreviousTag }}...{{ .Tag }}

changelog:
  sort: asc
  use: github
  filters:
    exclude:
      - '^docs:'
      - '^test:'
      - '^chore:'
      - Merge pull request
      - Merge branch

git:
  ignore_tags:
    - nightly

homebrew_casks:
  - name: betterdiscord-installer
    description: "A simple standalone program to install, repair, and uninstall BetterDiscord."
    homepage: "https://betterdiscord.app/"
    license: "MIT"
    binaries: [BetterDiscord-Installer]
    commit_author:
      name: zerebos
      email: 6865942+zerebos@users.noreply.github.com
    repository:
      owner: BetterDiscord
      name: homebrew-tap
      branch: main
      token: "{{ envOrDefault \"GH_PAT\" .Env.GITHUB_TOKEN }}"

winget:
  - name: BetterDiscord Installer
    package_identifier: BetterDiscord.Installer
    author: BetterDiscord
    release_notes: "{{ .Changelog }}"
    release_notes_url: https://github.com/BetterDiscord/Installer/releases/tag/{{ .Tag }}
    publisher: "BetterDiscord"
    publisher_url: "https://github.com/BetterDiscord"
    publisher_support_url: "https://github.com/BetterDiscord/Installer/issues"
    license: "MIT"
    license_url: "https://github.com/BetterDiscord/Installer/blob/main/LICENSE"
    short_description: "A standalone GUI installer for BetterDiscord."
    homepage: "https://betterdiscord.app/"
    tags: [gui, installer, discord, betterdiscord]
    url_template: "https://github.com/BetterDiscord/Installer/releases/download/{{ .Tag }}/{{ .ArtifactName }}"
    commit_author:
      name: zerebos
      email: 6865942+zerebos@users.noreply.github.com
    repository:
      owner: betterdiscord
      name: winget-pkgs
      branch: installer-{{ .Tag }}-{{ .Now.Format "20060102150405" }}
      token: "{{ envOrDefault \"GH_PAT\" .Env.GITHUB_TOKEN }}"
      pull_request:
        enabled: true
        base:
          owner: microsoft
          name: winget-pkgs
          branch: master
        draft: false
