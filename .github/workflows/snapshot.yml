name: Release Snapshot

# Manually-triggered cross-OS snapshot build. The per-PR "Release Snapshot" job
# in ci.yml only builds the Linux leg (RELEASE_OS defaults to linux), so the
# Windows .exe naming/resources and the macOS universal .app bundle + Info.plist
# are otherwise unverified until a real tag. Run this before tagging a release.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: snapshot-${{ github.ref }}
  cancel-in-progress: true

jobs:
  snapshot:
    name: Snapshot (${{ matrix.release_os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            release_os: linux
            skip_flags: winget,homebrew
          - os: windows-latest
            release_os: windows
            skip_flags: homebrew
          - os: macos-latest
            release_os: darwin
            skip_flags: winget
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install Linux dependencies
        if: ${{ matrix.os == 'ubuntu-latest' }}
        run: sudo apt-get -yq update && sudo apt-get -yq install libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'

      - name: Build snapshot
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: '~> v2'
          args: release --snapshot --clean --skip=${{ matrix.skip_flags }}
        env:
          RELEASE_OS: ${{ matrix.release_os }}

      - name: Upload snapshot artifacts
        uses: actions/upload-artifact@v4
        with:
          name: snapshot-${{ matrix.release_os }}
          path: |
            dist/BetterDiscord-Installer-*
            dist/appimage/BetterDiscord-Installer-Linux.AppImage.zip
          if-no-files-found: ignore
          retention-days: 7
